name: Docker

# 只有打了 tag 才构建镜像，push 到 main 不触发。
# 需要的 secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（没配就只校验不推送）

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}
  NAME: bot-panel

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 没有 Dockerfile 就跳过
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "仓库里还没有 Dockerfile，跳过构建"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.ok == 'true'

      - name: 登录 Docker Hub
        if: steps.check.outputs.ok == 'true' && env.IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取版本号
        id: meta
        if: steps.check.outputs.ok == 'true'
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.ok == 'true'
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bot-panel:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bot-panel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
