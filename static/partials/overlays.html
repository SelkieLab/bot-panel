<div class="settings-page" id="settingsPage" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <header class="settings-bar">
    <button class="btn icon ripple" id="settingsBack" aria-label="返回"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
    <h1 id="settingsTitle">设置</h1>
    <div class="spacer"></div>
  </header>
  <div class="settings-body" id="settingsBody"></div>
</div>

<button class="btn fab ripple" id="fabRefresh">刷新状态</button>
<div class="dlg-backdrop" id="dlgBackdrop" aria-hidden="true"><div class="dlg" id="dlgBody" role="dialog" aria-modal="true"></div></div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
