<section class="pane" id="pane-learn">
        <div class="card" style="margin-bottom:14px">
          <div class="row" style="margin-bottom:10px"><h2 style="margin:0">知识库</h2><div class="spacer"></div><span class="muted" id="kbCount"></span></div>
          <div class="row wrap" style="gap:10px">
            <select class="field" id="kbSelect" style="flex:1;min-width:200px;border-radius:24px;height:44px"></select>
            <button class="btn tonal" id="btnKbNew" style="border-radius:24px;height:44px">新建知识库</button>
            <button class="btn text" id="btnKbRefresh" style="border-radius:24px;height:44px">刷新</button>
          </div>
          <div class="muted" id="kbHint" style="margin-top:10px"></div>
        </div>

        <div class="card" style="margin-bottom:14px" id="kbEmbCard">
          <div class="row" style="margin-bottom:10px">
            <h2 style="margin:0">向量模型（Embedding）</h2>
            <div class="spacer"></div>
            <span class="tag" id="kbEmbTag">未配置</span>
          </div>
          <div class="muted" style="margin-bottom:12px">
            知识库要靠向量模型把文档变成可检索的向量。填一次之后，建库和上传都会自动用它。
          </div>
          <input class="field" id="embBase" placeholder="API Base URL，如 https://api.openai.com/v1" style="margin-bottom:10px">
          <input class="field" id="embKey" type="password" placeholder="API Key" style="margin-bottom:10px">
          <div class="row wrap" style="gap:10px;margin-bottom:12px">
            <input class="field" id="embModel" placeholder="模型名，如 text-embedding-3-small" style="flex:1;min-width:200px">
            <button class="btn text" id="btnEmbFetch" style="border-radius:24px;height:44px">获取模型</button>
          </div>
          <div class="row" style="gap:10px">
            <button class="btn filled" id="btnEmbSave" style="border-radius:24px;height:44px;flex:1">保存并接入 AstrBot</button>
            <button class="btn tonal" id="btnEmbTest" style="border-radius:24px;height:44px">测试</button>
          </div>
          <div class="muted" id="embMsg" style="margin-top:10px"></div>
        </div>

        <div class="card" style="margin-bottom:14px">
          <h2>上传文档</h2>
          <div class="dropzone" id="dropzone">
            <svg class="ic" style="width:34px;height:34px"><use href="#i-upload"/></svg>
            <div class="dz-title">把文件拖到这里，或点击选择</div>
            <div class="muted">支持 docx / pptx / xlsx / pdf / txt / md / html / csv / json，单个 ≤ 25MB</div>
            <input type="file" id="fileInput" multiple style="display:none">
          </div>
        </div>

        <div class="card" style="margin-bottom:14px">
          <div class="row" style="margin-bottom:10px"><h2 style="margin:0">检索测试</h2><div class="spacer"></div></div>
          <div class="muted" style="margin-bottom:10px">在这里试问一句，能看到从知识库真正召回了哪些片段，才算接好。</div>
          <div class="row wrap" style="gap:10px">
            <input class="field" id="kbQuery" placeholder="例如：退换货规则是什么？" style="flex:1;min-width:200px">
            <button class="btn tonal" id="btnKbQuery" style="border-radius:24px;height:44px">检索</button>
          </div>
          <div id="kbResult" style="margin-top:12px"></div>
        </div>

        <div class="card">
          <h2>已上传文档</h2>
          <div class="col" id="kbList"><div class="empty">还没有文档</div></div>
        </div>
      </section>
