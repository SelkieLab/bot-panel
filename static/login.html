<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131316">
<title>登录 · QQ Bot 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%23cfbcff'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23381e72'%3EQ%3C/text%3E%3C/svg%3E">
<style>
:root{--p:#cfbcff;--on-p:#381e72;--p-c:#4f378a;--s-c:#28272d;--bg:#131316;--on:#e6e1e6;--on-v:#cac4cf;--outline:#938f99;--err:#f2b8b5;--spring:cubic-bezier(.2,0,0,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;color:var(--on);
  font:14px/1.5 Roboto,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:radial-gradient(800px 400px at 80% -10%, color-mix(in srgb,var(--p) 18%,transparent) 0%,transparent 60%),radial-gradient(700px 400px at 0% 110%, color-mix(in srgb,var(--t) 14%,transparent) 0%,transparent 55%),var(--bg)}
.card{width:min(390px,100%);background:var(--s-c2);border:1px solid var(--outline-v);border-radius:28px;padding:32px 28px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  animation:in .45s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.logo{width:56px;height:56px;border-radius:18px;background:var(--p);color:var(--on-p);display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:18px}
h1{font-size:24px;font-weight:500;margin:0 0 6px}
p{color:var(--on-v);font-size:13px;margin:0 0 22px}
input{width:100%;height:52px;border-radius:12px 12px 0 0;border:none;border-bottom:1px solid var(--outline);background:var(--s-c3);color:var(--on);
  padding:0 16px;font-size:16px;outline:none;transition:.2s}
input:focus{border-bottom:2px solid var(--p);background:#333238}
button{margin-top:22px;width:100%;height:48px;border:none;border-radius:24px;background:var(--p);color:var(--on-p);font-size:15px;font-weight:600;cursor:pointer;transition:transform .15s var(--spring)}
button:active{transform:scale(.97)}
.err{color:var(--err);font-size:13px;margin-top:12px;min-height:18px}
</style>
</head>
<body>
<script src="/assets/a5ff8d4f147b/js/theme.js"></script>
<form class="card" id="f">
  <div class="logo">Q</div>
  <h1>QQ Bot 控制台</h1>
  <p>输入管理密码登录</p>
  <input id="pw" type="password" placeholder="密码" autocomplete="current-password" autofocus>
  <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="两步验证码（未启用可留空）" autocomplete="one-time-code" style="display:none;margin-top:10px">
  <div class="err" id="err"></div>
  <button type="submit">进入</button>
</form>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var code = document.getElementById('code').value.trim();
  document.getElementById('err').textContent = '';
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, code: code }) })
    .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (x) {
      if (x.j.ok) { location.href = '/'; return; }
      if (x.j.need2fa) {
        var box = document.getElementById('code');
        box.style.display = '';
        box.focus();
        document.getElementById('err').textContent = x.j.error || '请输入两步验证码';
        return;
      }
      document.getElementById('err').textContent = x.j.error || '登录失败';
    })
    .catch(function () { document.getElementById('err').textContent = '网络错误'; });
});
</script>
</body>
</html>
